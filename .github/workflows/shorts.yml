name: Daily Shorts
on:
  schedule:
    - cron: "30 4 * * *"   # 10:00 AM IST daily; edit as needed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: shorts-automation/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - run: pip install -r shorts-automation/requirements.txt
      - name: Generate and upload
        working-directory: shorts-automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NICHE: ${{ vars.NICHE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          PRIVACY: ${{ vars.PRIVACY }}
        run: python pipeline.py
      - name: Save history
        run: |
          git config user.name "shorts-bot"; git config user.email "bot@users.noreply.github.com"
          git add shorts-automation/history.json && git commit -m "Update shorts history" && git push || true
